<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Dienos kvitas" />
<meta name="theme-color" content="#FBF8F1" />
<title>Dienos kvitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');
:root{--paper:#FBF8F1;--panel:#FFFFFF;--ink:#221F1A;--soft:#726B5F;--line:#E4DECF;--accent:#7A2E4A;--pro:#3E7C7B;--carb:#C9922E;--fat:#B5726B;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper)}
.kv-wrap{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh;padding:28px 16px 56px;display:flex;justify-content:center}
.kv-sheet{width:100%;max-width:540px}
.kv-head{text-align:center;margin-bottom:18px}
.kv-title{font-family:'Fraunces',serif;font-weight:600;font-size:34px;line-height:1;letter-spacing:-.01em;margin:0}
.kv-sub{color:var(--soft);font-size:13px;margin:8px 0 0;letter-spacing:.02em}
.kv-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 1px 0 rgba(34,31,26,.03)}
.kv-viewtabs{display:flex;gap:6px;margin-bottom:16px;background:#EFE7D6;padding:5px;border-radius:12px}
.kv-viewtab{flex:1;font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--soft);background:transparent;border:none;border-radius:9px;padding:11px 6px;cursor:pointer;transition:all .15s}
.kv-viewtab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kv-tabs{display:flex;gap:6px;margin-bottom:14px;background:#F1EBDD;padding:4px;border-radius:11px}
.kv-tab{flex:1;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--soft);background:transparent;border:none;border-radius:8px;padding:9px 6px;cursor:pointer;transition:all .15s}
.kv-tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kv-input{width:100%;border:none;outline:none;resize:none;font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);background:transparent;line-height:1.5}
.kv-input::placeholder{color:#A9A296}
.kv-field{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kv-field input{border:none;outline:none;width:100%;font-family:'Inter',sans-serif;font-size:15px;background:transparent;color:var(--ink)}
.kv-row{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.kv-target{font-size:12px;color:var(--accent);font-weight:600;margin-top:10px}
.kv-btn{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 18px;cursor:pointer;transition:opacity .15s}
.kv-btn:disabled{opacity:.45;cursor:default}
.kv-btn2{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;cursor:pointer}
.kv-btn2:disabled{opacity:.4;cursor:default}
.kv-ghost{font-family:'Inter',sans-serif;font-size:13px;color:var(--soft);background:transparent;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.kv-thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.kv-err{color:var(--accent);font-size:13px;margin-top:10px;line-height:1.5}
.kv-res{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px dashed var(--line);cursor:pointer;border-radius:8px}
.kv-res:last-child{border-bottom:none}
.kv-pic{width:44px;height:44px;border-radius:9px;border:1px solid var(--line);object-fit:cover;background:#F1EBDD;flex:0 0 auto}
.kv-pic-ph{width:44px;height:44px;border-radius:9px;border:1px solid var(--line);background:#F1EBDD;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.kv-res-body{flex:1;min-width:0}
.kv-res-name{font-size:14px;font-weight:500;line-height:1.3}
.kv-res-kcal{font-family:'Space Mono',monospace;font-size:12px;color:var(--soft);margin-top:2px}
.kv-found{border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:14px;background:#FCFAF4}
.kv-found-name{font-weight:600;font-size:15px;margin-bottom:8px}
.kv-per100{font-family:'Space Mono',monospace;font-size:12px;color:var(--soft);display:flex;gap:12px;flex-wrap:wrap}
.kv-per100 b{color:var(--ink)}
.kv-grams{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.kv-grams input{width:110px;font-family:'Space Mono',monospace;font-size:15px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;color:var(--ink)}
.kv-chip{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;color:var(--accent);background:#F6EDF0;border:1px solid #E7D3DA;border-radius:8px;padding:8px 11px;cursor:pointer}
.kv-chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.kv-receipt-title{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);text-align:center;margin:0 0 14px}
.kv-line{padding:11px 0;border-bottom:1px dashed var(--line)}
.kv-line:last-of-type{border-bottom:none}
.kv-line-top{display:flex;align-items:baseline;gap:8px}
.kv-name{font-size:15px;font-weight:500}
.kv-lead{flex:1 1 auto;border-bottom:1px dotted #C9C1B0;transform:translateY(-3px)}
.kv-kcal{font-family:'Space Mono',monospace;font-weight:700;font-size:15px;white-space:nowrap}
.kv-macros{display:flex;gap:14px;margin-top:6px;font-family:'Space Mono',monospace;font-size:12px;color:var(--soft)}
.kv-macros b{font-weight:700;color:var(--ink)}
.kv-del{background:none;border:none;color:#B9B1A2;cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
.kv-empty{text-align:center;color:var(--soft);font-size:14px;padding:22px 8px;line-height:1.5}
.kv-total-rule{border:none;border-top:2px solid var(--ink);margin:6px 0 14px}
.kv-total-row{display:flex;justify-content:space-between;align-items:baseline}
.kv-total-label{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.kv-total-kcal{font-family:'Fraunces',serif;font-weight:600;font-size:32px}
.kv-portion{font-family:'Space Mono',monospace;font-size:13px;color:var(--soft);margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kv-portion input{width:56px;font-family:'Space Mono',monospace;font-size:13px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:5px 8px;outline:none;color:var(--ink)}
.kv-portion b{color:var(--ink);font-weight:700}
.kv-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:14px 0 10px;background:#EFE9DC}
.kv-legend{display:flex;flex-wrap:wrap;gap:14px;font-family:'Space Mono',monospace;font-size:12px;color:var(--soft)}
.kv-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.kv-goal{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--soft);flex-wrap:wrap}
.kv-goal input{width:70px;font-family:'Space Mono',monospace;font-size:13px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:5px 8px;outline:none;color:var(--ink)}
.kv-rem{font-family:'Space Mono',monospace;font-weight:700;color:var(--ink)}
.kv-tpl{display:flex;align-items:center;gap:10px;padding:11px 6px;border-bottom:1px dashed var(--line)}
.kv-tpl:last-child{border-bottom:none}
.kv-tpl-body{flex:1;min-width:0;cursor:pointer}
.kv-tpl-name{font-size:14px;font-weight:600}
.kv-tpl-kcal{font-family:'Space Mono',monospace;font-size:12px;color:var(--soft);margin-top:2px}
.kv-foot{text-align:center;color:#A9A296;font-size:11px;margin-top:20px;line-height:1.6}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;
const STORE_KEY = "dienos_kvitas_templates_v1";

const fmt = (n) => { const v = Number(n) || 0; return v >= 10 ? String(Math.round(v)) : (Math.round(v * 10) / 10).toString(); };
function per100From(nut){ const n = nut || {}; return { kcal:n["energy-kcal_100g"]||0, protein:n.proteins_100g||0, carbs:n.carbohydrates_100g||0, sugar:n.sugars_100g||0, fat:n.fat_100g||0 }; }
function sumItems(list){ return list.reduce((a,it)=>({ kcal:a.kcal+(+it.kcal||0), protein:a.protein+(+it.protein||0), carbs:a.carbs+(+it.carbs||0), sugar:a.sugar+(+it.sugar||0), fat:a.fat+(+it.fat||0), grams:a.grams+(+it.grams||0) }), {kcal:0,protein:0,carbs:0,sugar:0,fat:0,grams:0}); }
function loadTpls(){ try{ const v = localStorage.getItem(STORE_KEY); return v?JSON.parse(v):[]; }catch(e){ return []; } }
function saveTpls(list){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }catch(e){} }

// AI kreipinys eina per MUSU serverio funkcija /api/nutrition (raktas lieka serveryje)
async function askAI(system, content){
  const r = await fetch("/api/nutrition", {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ system, messages:[{ role:"user", content }] })
  });
  const data = await r.json();
  return (data.content || []).filter(b=>b.type==="text").map(b=>b.text).join("\n").replace(/```json|```/g,"").trim();
}

function Thumb({ src }){
  const [bad, setBad] = useState(false);
  if(!src || bad) return <div className="kv-pic-ph">🥯</div>;
  return <img className="kv-pic" src={src} alt="" onError={()=>setBad(true)} />;
}

function App(){
  const [view, setView] = useState("day");
  const [mode, setMode] = useState("search");
  const [q, setQ] = useState("");
  const [results, setResults] = useState([]);
  const [text, setText] = useState("");
  const [img, setImg] = useState(null);
  const [found, setFound] = useState(null);
  const [grams, setGrams] = useState("");
  const [items, setItems] = useState([]);
  const [dishName, setDishName] = useState("");
  const [dishItems, setDishItems] = useState([]);
  const [portions, setPortions] = useState(1);
  const [templates, setTemplates] = useState(loadTpls());
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [goal, setGoal] = useState(2000);
  const fileRef = useRef(null);

  function persist(list){ setTemplates(list); saveTpls(list); }

  const totals = useMemo(()=>sumItems(items), [items]);
  const dishTotals = useMemo(()=>sumItems(dishItems), [dishItems]);
  const perPortion = useMemo(()=>{ const p = Math.max(1, +portions||1); return { kcal:dishTotals.kcal/p, protein:dishTotals.protein/p, carbs:dishTotals.carbs/p, sugar:dishTotals.sugar/p, fat:dishTotals.fat/p }; }, [dishTotals, portions]);
  const bar = useMemo(()=>{ const p=totals.protein*4,c=totals.carbs*4,f=totals.fat*9,s=p+c+f||1; return {p:(p/s)*100,c:(c/s)*100,f:(f/s)*100}; }, [totals]);

  function resetPending(){ setFound(null); setGrams(""); setImg(null); setText(""); setQ(""); setResults([]); if(fileRef.current) fileRef.current.value=""; }
  function switchMode(m){ setMode(m); resetPending(); setErr(""); }
  function onFile(e){ const file = e.target.files && e.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=()=>setImg({preview:r.result, b64:String(r.result).split(",")[1], media:file.type||"image/jpeg"}); r.readAsDataURL(file); }

  async function search(){
    if(!q.trim()) return;
    setLoading(true); setErr(""); setResults([]); setFound(null);
    try{
      const fields="code,product_name,brands,image_front_small_url,image_small_url,product_quantity,nutriments";
      const url=`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q.trim())}&search_simple=1&action=process&json=1&page_size=15&fields=${fields}`;
      const r=await fetch(url); const d=await r.json();
      const prods=(d.products||[]).filter(p=>p.product_name).map(p=>({ code:p.code, name:[p.brands,p.product_name].filter(Boolean).join(" — "), img:p.image_front_small_url||p.image_small_url||"", quantity:+p.product_quantity||0, per100:per100From(p.nutriments) })).filter(p=>p.per100.kcal);
      if(!prods.length) setErr("Nieko neradau. Pabandyk kitą pavadinimą arba etiketės nuotrauką.");
      setResults(prods);
    }catch(e){ setErr("Nepavyko pasiekti produktų bazės. Pabandyk dar kartą arba naudok etiketę."); }
    finally{ setLoading(false); }
  }
  function pickResult(p){ setFound({ name:p.name, quantity:p.quantity||0, ...p.per100 }); setResults([]); }

  async function readLabel(){
    if(!img) return; setLoading(true); setErr(""); setFound(null);
    const sys="Tu skaitai maisto produkto 'Maistines vertes' lentele is nuotraukos. Grazink TIK gryna JSON: {\"name\":\"pavadinimas jei matosi arba tuscia\",\"kcal\":0,\"protein\":0,\"carbs\":0,\"sugar\":0,\"fat\":0,\"quantity\":0}. Vertes kcal/protein/carbs/sugar/fat PER 100 g. quantity = visos pakuotes neto kiekis gramais jei matosi, kitaip 0.";
    try{
      const raw=await askAI(sys, [ {type:"image", source:{type:"base64", media_type:img.media, data:img.b64}}, {type:"text", text:"Perskaityk maistine verte per 100 g."} ]);
      const p=JSON.parse(raw);
      setFound({ name:p.name||"Produktas iš etiketės", quantity:+p.quantity||0, kcal:+p.kcal||0, protein:+p.protein||0, carbs:+p.carbs||0, sugar:+p.sugar||0, fat:+p.fat||0 });
    }catch(e){ setErr("Nepavyko perskaityti etiketės. Pabandyk aiškesnę nuotrauką."); }
    finally{ setLoading(false); }
  }

  function pushItem(it){ if(view==="dish") setDishItems(p=>[...p,it]); else setItems(p=>[...p,it]); }

  async function estimateText(){
    if(!text.trim()) return; setLoading(true); setErr("");
    const sys="Tu esi mitybos skaiciuokle. Ivertink energine verte ir makro bendriniam maistui (vaisiai, uogos, kiausiniai ir pan.). Jei kiekis nenurodytas, imk tipine porcija. Atsakyk TIK gryna JSON: {\"items\":[{\"name\":\"lietuviskai\",\"grams\":0,\"kcal\":0,\"protein\":0,\"carbs\":0,\"sugar\":0,\"fat\":0}]}.";
    try{
      const raw=await askAI(sys, "Suskaiciuok: "+text.trim());
      const got=(JSON.parse(raw).items||[]).map((it,i)=>({ id:Date.now()+"-"+i, name:it.name||"Produktas", grams:+it.grams||0, kcal:+it.kcal||0, protein:+it.protein||0, carbs:+it.carbs||0, sugar:+it.sugar||0, fat:+it.fat||0 }));
      if(!got.length) throw new Error("empty");
      got.forEach(pushItem); resetPending();
    }catch(e){ setErr("Nepavyko suskaičiuoti. Pabandyk tiksliau aprašyti."); }
    finally{ setLoading(false); }
  }

  function addFound(){ const g=+grams; if(!found||!g) return; const k=g/100; pushItem({ id:Date.now()+"-f", name:found.name, grams:g, kcal:found.kcal*k, protein:found.protein*k, carbs:found.carbs*k, sugar:found.sugar*k, fat:found.fat*k }); resetPending(); }

  function saveTemplate(){ if(!dishItems.length) return; const t={ id:"t"+Date.now(), name:dishName.trim()||"Patiekalas", portions:Math.max(1,+portions||1), items:dishItems }; persist([t, ...templates]); }
  function loadTemplate(t){ setView("dish"); setDishName(t.name); setDishItems(t.items||[]); setPortions(t.portions||1); resetPending(); }
  function deleteTemplate(id){ persist(templates.filter(t=>t.id!==id)); }
  function addDishToDay(){ if(!dishItems.length) return; setItems(p=>[...p,{ id:Date.now()+"-d", name:(dishName.trim()||"Patiekalas"), grams:dishTotals.grams, kcal:dishTotals.kcal, protein:dishTotals.protein, carbs:dishTotals.carbs, sugar:dishTotals.sugar, fat:dishTotals.fat }]); setView("day"); }
  function addPortionToDay(){ if(!dishItems.length) return; const p=Math.max(1,+portions||1); setItems(x=>[...x,{ id:Date.now()+"-dp", name:(dishName.trim()||"Patiekalas")+" (1 porcija)", grams:dishTotals.grams/p, kcal:perPortion.kcal, protein:perPortion.protein, carbs:perPortion.carbs, sugar:perPortion.sugar, fat:perPortion.fat }]); setView("day"); }

  const remaining = Math.round((+goal||0) - totals.kcal);
  const targetLabel = view==="dish" ? "patiekalą" : "dieną";

  return (
    <div className="kv-wrap"><div className="kv-sheet">
      <div className="kv-head">
        <h1 className="kv-title">Dienos kvitas</h1>
        <p className="kv-sub">Skaičiuok dieną arba susidėk patiekalą iš sudedamųjų dalių</p>
      </div>

      <div className="kv-viewtabs">
        <button className={"kv-viewtab"+(view==="day"?" on":"")} onClick={()=>setView("day")}>Diena</button>
        <button className={"kv-viewtab"+(view==="dish"?" on":"")} onClick={()=>setView("dish")}>Patiekalai</button>
      </div>

      <div className="kv-card">
        <div className="kv-tabs">
          <button className={"kv-tab"+(mode==="search"?" on":"")} onClick={()=>switchMode("search")}>Paieška</button>
          <button className={"kv-tab"+(mode==="label"?" on":"")} onClick={()=>switchMode("label")}>Etiketė</button>
          <button className={"kv-tab"+(mode==="text"?" on":"")} onClick={()=>switchMode("text")}>Žodžiais</button>
        </div>

        {mode==="search" && (<>
          <div className="kv-field"><span style={{color:"var(--soft)"}}>🔍</span>
            <input placeholder="Produkto pavadinimas, pvz. sviestas, vištiena" value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&search()} /></div>
          <div className="kv-row"><button className="kv-btn" onClick={search} disabled={loading||!q.trim()}>{loading?"Ieškau…":"Ieškoti"}</button></div>
        </>)}
        {mode==="label" && (<>
          <div className="kv-row">
            <button className="kv-ghost" onClick={()=>fileRef.current&&fileRef.current.click()}>📷 Įkelti „Maistinės vertės" nuotrauką</button>
            <input ref={fileRef} type="file" accept="image/*" onChange={onFile} style={{display:"none"}} />
            {img && <img className="kv-thumb" src={img.preview} alt="etiketė" />}
          </div>
          <div className="kv-row"><button className="kv-btn" onClick={readLabel} disabled={loading||!img}>{loading?"Skaitau…":"Perskaityti etiketę"}</button></div>
        </>)}
        {mode==="text" && (<>
          <textarea className="kv-input" placeholder="pvz. bananas, saujelė mėlynių, virtas kiaušinis" value={text} onChange={e=>setText(e.target.value)} style={{minHeight:46}} />
          <div className="kv-row"><button className="kv-btn" onClick={estimateText} disabled={loading||!text.trim()}>{loading?"Skaičiuoju…":"Įvertinti"}</button></div>
        </>)}

        <div className="kv-target">Pridedama į: {view==="dish"?"PATIEKALĄ":"DIENĄ"}</div>
        {err && <div className="kv-err">{err}</div>}

        {results.length>0 && (
          <div style={{marginTop:14}}>
            {results.map(p=>(
              <div className="kv-res" key={p.code} onClick={()=>pickResult(p)}>
                <Thumb src={p.img} />
                <div className="kv-res-body"><div className="kv-res-name">{p.name}</div><div className="kv-res-kcal">{fmt(p.per100.kcal)} kcal / 100 g</div></div>
                <span style={{color:"var(--accent)", fontSize:20}}>＋</span>
              </div>
            ))}
          </div>
        )}

        {found && (
          <div className="kv-found">
            <div className="kv-found-name">{found.name}</div>
            <div className="kv-per100"><span>100 g:</span><span><b>{fmt(found.kcal)}</b> kcal</span><span>B <b>{fmt(found.protein)}</b></span><span>A <b>{fmt(found.carbs)}</b></span><span>cukr. <b>{fmt(found.sugar)}</b></span><span>R <b>{fmt(found.fat)}</b></span></div>
            <div style={{fontSize:14, color:"var(--soft)", marginTop:12}}>Kiek dedi į {targetLabel}?</div>
            <div className="kv-grams">
              {found.quantity>0 && (<button className={"kv-chip"+(String(found.quantity)===String(grams)?" on":"")} onClick={()=>setGrams(String(found.quantity))}>Visa pakuotė · {fmt(found.quantity)} g</button>)}
              <input type="number" placeholder="arba gramai" value={grams} onChange={e=>setGrams(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addFound()} />
              <span style={{fontSize:14, color:"var(--soft)"}}>g</span>
              <button className="kv-btn" onClick={addFound} disabled={!grams}>Pridėti</button>
            </div>
          </div>
        )}
      </div>

      {view==="day" && (<>
        <div className="kv-card">
          <p className="kv-receipt-title">— Šiandienos maistas —</p>
          {items.length===0 ? (<div className="kv-empty">Kol kas tuščia.<br/>Pridėk pirmą produktą viršuje.</div>)
          : items.map(it=>(
            <div className="kv-line" key={it.id}>
              <div className="kv-line-top"><span className="kv-name">{it.name}{it.grams?` · ${fmt(it.grams)} g`:""}</span><span className="kv-lead" /><span className="kv-kcal">{Math.round(it.kcal)} kcal</span><button className="kv-del" onClick={()=>setItems(p=>p.filter(x=>x.id!==it.id))}>✕</button></div>
              <div className="kv-macros"><span>B <b>{fmt(it.protein)}</b>g</span><span>A <b>{fmt(it.carbs)}</b>g</span><span>cukr. <b>{fmt(it.sugar)}</b>g</span><span>R <b>{fmt(it.fat)}</b>g</span></div>
            </div>
          ))}
        </div>
        <div className="kv-card">
          <hr className="kv-total-rule" />
          <div className="kv-total-row"><span className="kv-total-label">Iš viso</span><span className="kv-total-kcal">{Math.round(totals.kcal)} kcal</span></div>
          <div className="kv-bar"><div style={{width:bar.p+"%", background:"var(--pro)"}} /><div style={{width:bar.c+"%", background:"var(--carb)"}} /><div style={{width:bar.f+"%", background:"var(--fat)"}} /></div>
          <div className="kv-legend"><span><i className="kv-dot" style={{background:"var(--pro)"}} />Baltymai {fmt(totals.protein)} g</span><span><i className="kv-dot" style={{background:"var(--carb)"}} />Angliav. {fmt(totals.carbs)} g</span><span><i className="kv-dot" style={{background:"var(--fat)"}} />Riebalai {fmt(totals.fat)} g</span><span style={{color:"var(--soft)"}}>iš jų cukraus {fmt(totals.sugar)} g</span></div>
          <div className="kv-goal"><span>Dienos norma:</span><input type="number" value={goal} onChange={e=>setGoal(e.target.value)} /><span>kcal ·</span><span>liko <span className="kv-rem">{remaining}</span> kcal</span></div>
        </div>
      </>)}

      {view==="dish" && (<>
        <div className="kv-card">
          <div className="kv-field" style={{marginBottom:4}}><span style={{color:"var(--soft)"}}>🍲</span><input placeholder="Patiekalo pavadinimas, pvz. Vištienos troškinys" value={dishName} onChange={e=>setDishName(e.target.value)} /></div>
          <p className="kv-receipt-title" style={{marginTop:14}}>— Sudedamosios dalys —</p>
          {dishItems.length===0 ? (<div className="kv-empty">Dar tuščia.<br/>Pridėk produktus viršuje — jie kris čia.</div>)
          : dishItems.map(it=>(
            <div className="kv-line" key={it.id}>
              <div className="kv-line-top"><span className="kv-name">{it.name}{it.grams?` · ${fmt(it.grams)} g`:""}</span><span className="kv-lead" /><span className="kv-kcal">{Math.round(it.kcal)} kcal</span><button className="kv-del" onClick={()=>setDishItems(p=>p.filter(x=>x.id!==it.id))}>✕</button></div>
              <div className="kv-macros"><span>B <b>{fmt(it.protein)}</b>g</span><span>A <b>{fmt(it.carbs)}</b>g</span><span>cukr. <b>{fmt(it.sugar)}</b>g</span><span>R <b>{fmt(it.fat)}</b>g</span></div>
            </div>
          ))}
        </div>
        <div className="kv-card">
          <hr className="kv-total-rule" />
          <div className="kv-total-row"><span className="kv-total-label">Visas patiekalas</span><span className="kv-total-kcal">{Math.round(dishTotals.kcal)} kcal</span></div>
          <div className="kv-legend" style={{marginTop:10}}><span>Baltymai {fmt(dishTotals.protein)} g</span><span>Angliav. {fmt(dishTotals.carbs)} g</span><span>Riebalai {fmt(dishTotals.fat)} g</span><span style={{color:"var(--soft)"}}>cukraus {fmt(dishTotals.sugar)} g · sveria {fmt(dishTotals.grams)} g</span></div>
          <div className="kv-portion"><span>Porcijų:</span><input type="number" value={portions} onChange={e=>setPortions(e.target.value)} /><span>→ 1 porcija: <b>{Math.round(perPortion.kcal)} kcal</b> · B {fmt(perPortion.protein)} · A {fmt(perPortion.carbs)} · R {fmt(perPortion.fat)} g</span></div>
          <div className="kv-row" style={{marginTop:16}}>
            <button className="kv-btn" onClick={saveTemplate} disabled={!dishItems.length}>Išsaugoti šabloną</button>
            <button className="kv-btn2" onClick={addPortionToDay} disabled={!dishItems.length}>Porciją į dieną</button>
            <button className="kv-btn2" onClick={addDishToDay} disabled={!dishItems.length}>Visą į dieną</button>
          </div>
        </div>
        <div className="kv-card">
          <p className="kv-receipt-title">— Išsaugoti šablonai —</p>
          {templates.length===0 ? (<div className="kv-empty">Dar nėra šablonų.<br/>Susidėk patiekalą ir paspausk „Išsaugoti šabloną".</div>)
          : templates.map(t=>{ const tt=sumItems(t.items||[]); return (
            <div className="kv-tpl" key={t.id}>
              <div className="kv-tpl-body" onClick={()=>loadTemplate(t)}><div className="kv-tpl-name">{t.name}</div><div className="kv-tpl-kcal">{Math.round(tt.kcal)} kcal · {(t.items||[]).length} sudedamosios · {t.portions||1} porc.</div></div>
              <button className="kv-del" onClick={()=>deleteTemplate(t.id)}>✕</button>
            </div>
          ); })}
        </div>
      </>)}

      <p className="kv-foot">Duomenys — Open Food Facts. AI vertės — įvertis, ne laboratorinė vertė.</p>
    </div></div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
